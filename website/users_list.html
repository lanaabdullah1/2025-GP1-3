{% extends "layouts/user_layout.html" %}

{% block content %}

<div class="frm_submit_block">
    <h4>Users List</h4>
</div>

<div class="row">
    <div class="col-lg-12 col-md-12">
        <div class="dashboard_property">
            <div class="table-responsive">

                <table class="table">
                    <thead class="thead-dark">
                        <tr>
                            <th>Num</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% if not users %}
                        <tr>
                            <td colspan="6">No users</td>
                        </tr>
                        {% else %}

                        {% for user in users %}
                        <tr>

                            <td>{{ loop.index }}</td>

                            <td>
                                <h6>{{ user[1] }}</h6>
                            </td>

                            <td>
                                <h6>{{ user[2] }}</h6>
                            </td>

                            <td>
                                <h6>{{ user[5] or '-' }}</h6>
                            </td>

                            <td>
                                <h6>{{ user[4] }}</h6>
                            </td>

                            <td>
                                <div class="_leads_action">

                                    <a href="/user_update/{{ user[0] }}"
                                        data-bs-toggle="tooltip"
                                        data-bs-placement="bottom"
                                        data-bs-title="Edit this user's information"
                                        aria-label="Edit user">
                                            <i class="fas fa-edit"></i>
                                    </a>

                                   <a href="#"
                                        data-bs-toggle="tooltip"
                                        data-bs-placement="bottom"
                                        data-bs-title="Delete this user from the system"
                                        aria-label="Delete user"
                                        onclick="showConfirmModal('Are you sure you want to delete user: {{ user[1] }}?', function() {
                                            window.location.href = '/user_delete/{{ user[0] }}';
                                        }); return false;">
                                            <i class="fas fa-trash"></i>
                                    </a>


                                </div>
                            </td>

                        </tr>
                        {% endfor %}

                        {% endif %}

                    </tbody>
                </table>

            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    if (!window.bootstrap || !bootstrap.Tooltip) {
        console.warn("Bootstrap tooltips are not available.");
        return;
    }

    document.querySelectorAll(
        '._leads_action [data-bs-toggle="tooltip"]'
    ).forEach(function (element) {

        bootstrap.Tooltip.getOrCreateInstance(element, {
            trigger: "hover focus",
            container: "body"
        });

    });

});
</script>


{% endblock %}
